name: TestDriver.ai Run

on:
    workflow_run:
        workflows: ["TestDriver.ai Build"]
        types:
            - completed

env:
    NODE_VERSION: 22
    TESTDRIVERAI_VERSION: "7.11.59"
    VITEST_VERSION: "4"

permissions:
    contents: read
    statuses: write

jobs:
    trust_gate:
        name: Reject fork-produced workflow runs
        runs-on: ubuntu-22.04
        steps:
            - name: Verify the triggering run originates from this repository
              env:
                  HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
                  THIS_REPO: ${{ github.repository }}
                  RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
                  RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
                  RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
              run: |
                  echo "workflow_run head repository: $HEAD_REPO"
                  echo "workflow_run head branch:     $RUN_HEAD_BRANCH"
                  echo "workflow_run head sha:        $RUN_HEAD_SHA"
                  echo "workflow_run conclusion:      $RUN_CONCLUSION"
                  if [ -z "$HEAD_REPO" ] || [ "$HEAD_REPO" != "$THIS_REPO" ]; then
                      echo "::error::Untrusted workflow_run origin '$HEAD_REPO'. This workflow mints TestDriver OIDC credentials and executes downloaded build artifacts, so it must only consume runs produced by this repository ('$THIS_REPO'); fork-produced code and artifacts are rejected before any authentication or execution."
                      exit 1
                  fi
                  echo "Trust gate passed: triggering run originates from this repository."

    run_testdriver:
        name: Run TestDriver.ai
        runs-on: windows-latest
        needs: trust_gate
        if: github.event.workflow_run.conclusion == 'success'
        permissions:
            actions: read # lets the test resolve the triggering run's artifact download URL
            contents: read
            id-token: write # required for TestDriver OIDC authentication
            statuses: write
        steps:
            # SECURITY (workflow_run): test definitions are checked out from the
            # repository's default branch, never from the triggering run's head
            # SHA. The only thing taken from the triggering run is the built
            # `windows-exe` artifact itself, and only after the trust gate has
            # proven the run was produced by this same repository. Fork-
            # controlled workflow files, test code, and scripts therefore never
            # execute in this privileged (OIDC) context. (This fork's default
            # branch is prefer-pwsh7-windows; the previous hard-coded `main`
            # checkout tested a stale branch that lacked the current test
            # definitions.)
            - name: Check out trusted test definitions from the default branch
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.repository.default_branch }}

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Install TestDriver SDK and Vitest
              # Run from inside testdriver/ so npm resolves testdriver/package.json
              # as the project. `npm install --prefix testdriver` from the repo
              # root instead treats the ROOT package.json as the project and
              # installs the whole Electron app's dependencies (and runs its
              # postinstall scripts) into the prefix, which fails on the runner.
              working-directory: testdriver
              shell: pwsh
              run: |
                  Set-StrictMode -Version Latest
                  $ErrorActionPreference = "Stop"
                  $packageJson = @{
                      name         = "waveterm-testdriver-ci"
                      private      = $true
                      type         = "module"
                      dependencies = @{
                          testdriverai = $env:TESTDRIVERAI_VERSION
                          vitest       = "^$($env:VITEST_VERSION).0.0"
                      }
                  } | ConvertTo-Json -Depth 4
                  Set-Content -Path "package.json" -Value $packageJson
                  @'
                  import { defineConfig } from "vitest/config";

                  export default defineConfig({
                      test: {
                          include: ["*.test.mjs"],
                          setupFiles: ["testdriverai/vitest/setup"],
                          testTimeout: 600000,
                          hookTimeout: 600000,
                          pool: "forks",
                          reporters: ["verbose"],
                      },
                  });
                  '@ | Set-Content -Path "vitest.config.mjs"
                  npm install --no-audit --no-fund

            - name: Authenticate to TestDriver
              id: testdriver_auth
              uses: testdriverai/action@dae708d6ddf79ce83a3735de225336dc03d4c6e8
              with:
                  # Optional stored-key fallback used only if TestDriver OIDC is
                  # not configured for this org. NOTE: this repository currently
                  # has no TD_API_KEY repo secret, so this is empty and OIDC is
                  # the only active path (secure default). The legacy workflow's
                  # DASHCAM_API secret likewise does not exist in this repo.
                  api-key: ${{ secrets.TD_API_KEY }}

            # The test resolves the triggering run's windows-exe artifact on the
            # runner (GH_TOKEN never leaves the runner) and hands the sandbox a
            # short-lived GitHub-signed download URL. No third-party file host
            # is involved in the artifact transport.
            - name: Run onboarding test
              working-directory: testdriver
              env:
                  FORCE_COLOR: "3"
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  WAVETERM_BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
              run: npx vitest run onboarding.test.mjs
