name: TestDriver.ai Run

on:
    workflow_run:
        workflows: ["TestDriver.ai Build"]
        types:
            - completed

env:
    NODE_VERSION: 22
    TESTDRIVERAI_VERSION: "7.11.59"
    VITEST_VERSION: "4"

permissions:
    contents: read
    statuses: write

jobs:
    trust_gate:
        name: Reject fork-produced workflow runs
        runs-on: ubuntu-22.04
        steps:
            - name: Verify the triggering run originates from this repository
              env:
                  HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
                  THIS_REPO: ${{ github.repository }}
                  RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
                  RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
                  RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
              run: |
                  echo "workflow_run head repository: $HEAD_REPO"
                  echo "workflow_run head branch:     $RUN_HEAD_BRANCH"
                  echo "workflow_run head sha:        $RUN_HEAD_SHA"
                  echo "workflow_run conclusion:      $RUN_CONCLUSION"
                  if [ -z "$HEAD_REPO" ] || [ "$HEAD_REPO" != "$THIS_REPO" ]; then
                      echo "::error::Untrusted workflow_run origin '$HEAD_REPO'. This workflow mints TestDriver OIDC credentials and executes downloaded build artifacts, so it must only consume runs produced by this repository ('$THIS_REPO'); fork-produced code and artifacts are rejected before any authentication or execution."
                      exit 1
                  fi
                  echo "Trust gate passed: triggering run originates from this repository."

    run_testdriver:
        name: Run TestDriver.ai
        runs-on: windows-latest
        needs: trust_gate
        if: github.event.workflow_run.conclusion == 'success'
        permissions:
            actions: read # read artifacts of the triggering build run
            contents: read
            id-token: write # required for TestDriver OIDC authentication
            statuses: write
        steps:
            - name: Check out workflow test sources from this repository
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Install TestDriver SDK and Vitest
              shell: pwsh
              run: |
                  Set-StrictMode -Version Latest
                  $ErrorActionPreference = "Stop"
                  $packageJson = @{
                      name         = "waveterm-testdriver-ci"
                      private      = $true
                      type         = "module"
                      dependencies = @{
                          testdriverai = $env:TESTDRIVERAI_VERSION
                          vitest       = "^$($env:VITEST_VERSION).0.0"
                      }
                  } | ConvertTo-Json -Depth 4
                  Set-Content -Path "testdriver/package.json" -Value $packageJson
                  @'
                  import { defineConfig } from "vitest/config";

                  export default defineConfig({
                      test: {
                          include: ["*.test.mjs"],
                          setupFiles: ["testdriverai/vitest/setup"],
                          testTimeout: 600000,
                          hookTimeout: 600000,
                          pool: "forks",
                          reporters: ["verbose"],
                      },
                  });
                  '@ | Set-Content -Path "testdriver/vitest.config.mjs"
                  npm install --prefix testdriver --no-audit --no-fund

            - name: Download Wave installer artifact from the triggering run
              shell: pwsh
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
                  REPO: ${{ github.repository }}
              run: |
                  Set-StrictMode -Version Latest
                  $ErrorActionPreference = "Stop"
                  $headers = @{ Authorization = "Bearer $env:GH_TOKEN" }
                  $artifacts = Invoke-RestMethod `
                      -Uri "https://api.github.com/repos/$env:REPO/actions/runs/$env:UPSTREAM_RUN_ID/artifacts" `
                      -Headers $headers
                  $artifact = $artifacts.artifacts | Where-Object { $_.name -eq "windows-exe" } | Select-Object -First 1
                  if (-not $artifact) {
                      Write-Error "Artifact 'windows-exe' not found on workflow run $env:UPSTREAM_RUN_ID."
                      exit 1
                  }
                  $zipPath = Join-Path $env:TEMP "windows-exe.zip"
                  Invoke-WebRequest -Uri $artifact.archive_download_url -Headers $headers -OutFile $zipPath -MaximumRedirection 5
                  $extractPath = Join-Path $env:TEMP "windows-exe"
                  Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
                  $installer = Get-ChildItem -Path $extractPath -Filter *.exe -Recurse | Select-Object -First 1
                  if (-not $installer) {
                      Write-Error "No .exe installer found inside the 'windows-exe' artifact."
                      exit 1
                  }
                  Write-Host "Installer: $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 1)) MB)"
                  "WAVE_INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

            - name: Publish installer at a one-shot URL for the test sandbox
              shell: pwsh
              run: |
                  Set-StrictMode -Version Latest
                  $ErrorActionPreference = "Stop"
                  Write-Host "Uploading WAVE_INSTALLER_PATH to file.io (one-shot, deleted after first download)..."
                  $upload = Invoke-RestMethod -Uri "https://file.io" -Method Post -Form @{ file = Get-Item $env:WAVE_INSTALLER_PATH }
                  if (-not $upload.link) {
                      Write-Error "Installer upload failed: $($upload | ConvertTo-Json -Compress)"
                      exit 1
                  }
                  Write-Host "Installer published at a one-shot URL."
                  "WAVETERM_INSTALLER_URL=$($upload.link)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

            - name: Authenticate to TestDriver
              id: testdriver_auth
              uses: testdriverai/action@dae708d6ddf79ce83a3735de225336dc03d4c6e8
              with:
                  api-key: ${{ secrets.TD_API_KEY }} # optional fallback if OIDC is not configured for this org

            - name: Run onboarding test
              working-directory: testdriver
              env:
                  FORCE_COLOR: "3"
              run: npx vitest run onboarding.test.mjs
